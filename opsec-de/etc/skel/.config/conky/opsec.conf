-- opsecDE Conky system monitor
conky.config = {
    update_interval = 2.0,
    double_buffer = true,
    own_window = true,
    own_window_type = 'override',
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    alignment = 'top_right',
    gap_x = 16,
    gap_y = 44,
    border_width = 0,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'Noto Sans Mono:size=10',
    foreground = '#94a3b8',
    background = false,
    default_color = '#94a3b8',
    maximum_width = 300,
};

conky.text = [[
${color #38bdf8}${font Noto Sans:size=12:bold}opsecOS${font}${color}
${hr 1}
${color #e2e8f0}Kernel   ${color #94a3b8}${kernel}
${color #e2e8f0}Uptime   ${color #94a3b8}${uptime}
${color #e2e8f0}CPU      ${color #38bdf8}${cpu}%${color #94a3b8} ${cpubar 6}
${color #e2e8f0}RAM      ${color #38bdf8}${mem}${color #94a3b8} / ${memmax} ${membar 6}
${color #e2e8f0}Disk     ${color #94a3b8}${fs_used /} / ${fs_size /} ${fs_bar 6 /}
${color #e2e8f0}Network  ${color #94a3b8}${addr wlan0}${if_upd eth0} ${addr eth0}${endif}
${color #e2e8f0}IP       ${color #22c55e}${execi 60 curl -s --max-time 3 ifconfig.me || echo offline}
${color #e2e8f0}VPN      ${color #22c55e}${execi 5 mullvad status 2>/dev/null | head -n1 || echo n/a}
${color #e2e8f0}Clock    ${color #f59e0b}${time %H:%M:%S}
${hr 1}
${color #22c55e}${font Noto Sans:size=9:bold}SECURITY ACTIVE${font}${color}
]]
