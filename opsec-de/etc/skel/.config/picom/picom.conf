# opsecDE picom compositor config

backend = "glx";

vsync = true;

shadow = true;
shadow-radius = 10;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.35;
shadow-color = "#000000";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'plank'",
  "class_g = 'dunst'",
  "class_g = 'conky'",
  "class_g = 'opsec-panel'"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

inactive-opacity = 0.97;
inactive-opacity-override = false;
active-opacity = 1.0;

opacity-rule = [
  "85:class_g = 'dunst'",
  "95:class_g = 'plank'"
];

corner-radius = 8;
round-borders = 8;
rounded-corners-exclude = [
  "class_g = 'plank'",
  "class_g = 'opsec-panel'",
  "class_g = 'dunst'"
];

mark-wmwin-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 0;

unredir-if-possible = false;
