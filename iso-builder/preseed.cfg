# opsecOS preseed — the embedded Debian installer stays fully graphical and
# interactive; this file only (a) makes sure curl/ca-certificates exist in the
# target so the opsec repo can be fetched, and (b) installs the opsec suite
# into the freshly installed system at the very end (late_command).
#
# Nothing here preselects partitioning, users, or mirrors — the GUI asks for
# all of that, so you get a real "full installation GUI" experience.

# Install curl + ca-certificates into the target during the package phase so
# late_command can talk to the opsec GitHub Pages APT repo over HTTPS.
d-i pkgsel/include string curl ca-certificates gnupg lsb-release

# At the end of installation, add the opsec repo and install opsec + opsec-de.
# Failures are non-fatal (e.g. no network): the user can run
#   curl -fsSL https://officialckazros.github.io/OpSec-install/add-repo.sh | sudo bash
#   sudo apt install opsec opsec-de
# later to finish setup.
d-i preseed/late_command string \
    in-target /bin/bash -c 'export DEBIAN_FRONTEND=noninteractive; (curl -fsSL https://officialckazros.github.io/OpSec-install/add-repo.sh | bash) >/dev/null 2>&1 || true; apt-get update -qq >/dev/null 2>&1 || true; apt-get install -y --allow-unauthenticated opsec opsec-de >/dev/null 2>&1 || true'
